{% macro assignment_select(selected=none, id='assigned-user') %}
<select id="{{ id }}" name="assigned_user_id" aria-label="Người phụ trách"><option value="">Chưa phân công</option>{% if selected and selected not in analyst_accounts|map(attribute='id')|list %}<option value="{{ selected }}" selected>Tài khoản không còn hoạt động — chọn người khác</option>{% endif %}{% for user in analyst_accounts %}<option value="{{ user.id }}" {% if user.id==selected %}selected{% endif %}>{{ user.full_name }} ({{ user.username }})</option>{% endfor %}</select>
{% endmacro %}
