<div class="segment-controls"><label for="segment-select">Phân khúc</label><select id="segment-select" data-report-navigation>{% for key,label in segment_options.items() %}<option value="{{ cohort_url(request.endpoint,segment=key,drill_kind=None,drill_value=None) }}" {% if segment_key==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
<label for="segment-order">Ưu tiên theo</label><select id="segment-order" data-report-navigation>{% for key,label in segment_order_options.items() %}<option value="{{ cohort_url(request.endpoint,segment_order=key) }}" {% if segment_order==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
<div class="segmented-control"><a data-dashboard-nav class="{% if segment_metric=='alert_share' %}active{% endif %}" href="{{ cohort_url(request.endpoint,segment_metric='alert_share') }}">Tỷ lệ cảnh báo</a><a data-dashboard-nav class="{% if segment_metric=='mean_score' %}active{% endif %}" href="{{ cohort_url(request.endpoint,segment_metric='mean_score') }}">Điểm trung bình</a></div></div>
