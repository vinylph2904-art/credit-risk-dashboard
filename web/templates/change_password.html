{% extends 'base.html' %}
{% from '_components.html' import csrf with context %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block breadcrumb %}Đổi mật khẩu{% endblock %}
{% block topbar_content %}
<div class="workspace-heading"><h1>Đổi mật khẩu</h1></div>
{% endblock %}
{% block content %}<section class="panel account-password"><div class="panel-body"><form method="post" class="form-stack">{{ csrf() }}<div class="field"><label for="current-password">Mật khẩu hiện tại</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" maxlength="256" required></div><div class="field"><label for="new-password">Mật khẩu mới</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></div><div class="field"><label for="confirm-password">Nhập lại mật khẩu mới</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></div><div><button class="button primary" type="submit">Đổi mật khẩu</button></div></form></div></section>{% endblock %}
